name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install ruff
      - name: Lint (new/core modules)
        run: |
          ruff check \
            src/auth src/ai src/classify src/ingest src/db/session.py \
            src/config.py src/api_v3.py src/api_v3_data.py scripts
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - name: Skip if scaffold not present
        id: exists
        run: echo "present=$(test -f package.json && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.exists.outputs.present == 'yes'
        run: npm ci
      - name: Lint
        if: steps.exists.outputs.present == 'yes'
        run: npm run lint
      - name: Build
        if: steps.exists.outputs.present == 'yes'
        run: npm run build
