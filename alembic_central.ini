# Migraciones de la BD central (auth, enrutado a tenants, cola, concesiones).
# Uso: alembic -c alembic_central.ini upgrade head
# URL: CENTRAL_DATABASE_URL o, en modo single, DATABASE_URL.
[alembic]
script_location = %(here)s/alembic_central
prepend_sys_path = .
path_separator = os
version_table = alembic_version_central
sqlalchemy.url = sqlite:///./financial.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
